<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HiTech Aesthetics - Luxury Medical Aesthetics Clinic offering advanced treatments and personalised care.">
    <!-- Preload critical fonts -->
    <link rel="preload" href="/fonts/ivy-presto-display-light.otf" as="font" type="font/otf" crossorigin="anonymous">
    <link rel="preload" href="/fonts/ivy-presto-display-thin.otf" as="font" type="font/otf" crossorigin="anonymous">
    
    <!-- Google Fonts with display swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1ECGTNQ6YB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1ECGTNQ6YB');
    </script>

    <title>HiTech Aesthetics | Luxury Medical Aesthetics</title>
    <!-- Local Business Schema Markup -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalBusiness",
        "name": "HiTech Aesthetics",
        "image": "/images/logo.svg",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "114 Camden Road",
          "addressLocality": "Tunbridge Wells",
          "postalCode": "TN1 2QX",
          "addressCountry": "GB"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 51.1423,
          "longitude": 0.2640
        },
        "url": "https://www.hitechaesthetics.com",
        "telephone": "+441892338157",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "09:00",
            "closes": "17:30"
          }
        ],
        "priceRange": "\u00A3\u00A3\u00A3"
      }
    </script>
  </head>
  <body>
    <!-- Hidden form for Netlify Forms detection -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="service"></select>
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
