<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preload" href="/fonts/ivy-presto-display-thin.otf" as="font" type="font/otf" crossorigin="anonymous">
    
    <!-- Google Fonts with display swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Local Business Schema Markup -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalBusiness",
        "name": "HiTech Aesthetics",
        "image": "/images/logo.svg",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "114 Camden Road",
          "addressLocality": "Tunbridge Wells",
          "postalCode": "TN1 2QX",
          "addressCountry": "GB"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 51.1423,
          "longitude": 0.2640
        },
        "url": "https://hitechaesthetics.co.uk",
        "telephone": "+441892338157",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "09:30",
            "closes": "17:30"
          }
        ],
        "priceRange": "£££"
      }
